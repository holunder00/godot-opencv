# .github/workflows/build.yml
name: Build & Release GDOpenCV

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  OPENCV_VERSION: 4.10.0
  OPENCV_MODULES: core,imgproc,imgcodecs,videoio,objdetect,features2d,calib3d

jobs:
  build:
    strategy:
      matrix:
        include:
         # - platform: linux
         #   os: ubuntu-22.04
          - platform: windows
            os: windows-latest
        #  - platform: macos
         #   os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      # V4L2 headers for webcam support on Linux
      - name: Linux build deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev

      # --- Static OpenCV: identical build on all platforms ---
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: opencv-install
          key: opencv-${{ env.OPENCV_VERSION }}-static-${{ matrix.platform }}-v1
          # bump the -v1 suffix whenever you change the cmake flags below

      - name: Build OpenCV (static)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch ${OPENCV_VERSION} https://github.com/opencv/opencv.git

          EXTRA_FLAGS=""
          if [ "${{ matrix.platform }}" == "macos" ]; then
            EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64"
          fi

          cmake -S opencv -B opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=${OPENCV_MODULES} \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_GTK=OFF \
            -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_TIFF=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_OPENJPEG=OFF \
            -DWITH_JASPER=OFF \
            -DWITH_IPP=OFF \
            -DWITH_V4L=ON \
            -DBUILD_ZLIB=ON \
            -DBUILD_PNG=ON \
            -DBUILD_JPEG=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_WITH_STATIC_CRT=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/opencv-install" \
            $EXTRA_FLAGS

          cmake --build opencv-build --config Release -j4
          cmake --build opencv-build --config Release --target install

      - name: Export OpenCV path
        shell: bash
        run: echo "OPENCV_DIR=${GITHUB_WORKSPACE}/opencv-install" >> $GITHUB_ENV

      - name: Debug - show OpenCV install layout
        shell: bash
        run: |
          find opencv-install -name "*.a" -o -name "*.lib" | head -40

      # --- Build godot-cpp + extension ---
      - name: Build godot-cpp
        shell: bash
        run: |
          ARCH_FLAG=""
          [ "${{ matrix.platform }}" == "macos" ] && ARCH_FLAG="arch=arm64"
          scons -C godot-cpp platform=${{ matrix.platform }} target=template_debug $ARCH_FLAG -j4
          scons -C godot-cpp platform=${{ matrix.platform }} target=template_release $ARCH_FLAG -j4

      - name: Build extension
        shell: bash
        run: |
          ARCH_FLAG=""
          [ "${{ matrix.platform }}" == "macos" ] && ARCH_FLAG="arch=arm64"
          scons -C build platform=${{ matrix.platform }} target=template_debug $ARCH_FLAG -j4 verbose=yes
          scons -C build platform=${{ matrix.platform }} target=template_release $ARCH_FLAG -j4 verbose=yes

      - name: Debug - list built files
        shell: bash
        run: find . -name "*.dylib" -o -name "*.so" -o -name "*.dll" | grep -v godot-cpp | head -20

      # --- Collect binaries (no dependency bundling needed) ---
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p out/${{ matrix.platform }}
          cp build/addons/gdopencv/bin/${{ matrix.platform }}/* out/${{ matrix.platform }}/
          ls -la out/${{ matrix.platform }}

      - name: Sanity check (Linux)
        if: matrix.platform == 'linux'
        run: |
          for f in out/linux/*.so; do
            echo "== $f"; ldd "$f"
            if ldd "$f" | grep -E "opencv|libav|libgstreamer"; then
              echo "ERROR: unexpected shared dependency!"; exit 1
            fi
          done

      - name: Sanity check (macOS)
        if: matrix.platform == 'macos'
        run: |
          for f in out/macos/*.dylib; do
            echo "== $f"; otool -L "$f"
            if otool -L "$f" | grep -E "opencv|/opt/homebrew|/usr/local/opt"; then
              echo "ERROR: unexpected shared dependency!"; exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binaries
          path: out/${{ matrix.platform }}/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: addons/gdopencv/bin/linux/

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: addons/gdopencv/bin/windows/

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: addons/gdopencv/bin/macos/

      - name: Create release archive
        run: |
          cd addons
          zip -r ../gdopencv-addon.zip gdopencv/

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: gdopencv-addon
          path: gdopencv-addon.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gdopencv-addon.zip
